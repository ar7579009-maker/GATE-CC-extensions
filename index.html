<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co" />
<meta name="theme-color" content="#0F0F0E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>GATE CSE 2027 Command Center</title>
<style>
:root{--bg:#0F0F0E;--panel:#1C1D1B;--panel2:#242522;--line:#3A3936;--ink:#EDEAE2;--mute:#8A8880;--dim:#5A5850;--amber:#D68A2B;--green:#4A7C6C;--red:#A8452F;--blue:#7B8CDE;--display:Bahnschrift,"DIN Alternate","Arial Narrow",sans-serif}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",-apple-system,system-ui,sans-serif;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.drag{height:36px;-webkit-app-region:drag;display:flex;align-items:center;padding:0 14px;font:600 13px var(--display);letter-spacing:.04em;color:var(--mute)}
.shell{display:flex;flex-direction:column;height:calc(100% - 36px)}
main{flex:1;overflow:auto;padding:4px 14px 20px}
.wrap{max-width:820px;margin:0 auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:11px 4px;font:600 13px var(--display);cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--amber)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
h2{margin:0 0 10px;font:600 17px var(--display)}h3{margin:0 0 6px;font:600 14px var(--display)}
.timer{font:700 56px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.num{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
select,input[type=text],input[type=number],input[type=date],input[type=time]{color-scheme:dark;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;max-width:100%}
input[type=number]{width:74px}
input[type=range]{accent-color:var(--amber);width:100%}
input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px;cursor:pointer}
.btn{background:var(--amber);color:#1C1D1B;border:0;border-radius:6px;padding:9px 18px;font:700 14px var(--display);cursor:pointer}
.btn.stop{background:var(--red);color:var(--ink)}.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--amber)}
.bar.g>i{background:var(--green)}.bar.r>i{background:var(--red)}.bar.b>i{background:var(--blue)}
details.sub{border-top:1px solid var(--line)}details.sub>summary{cursor:pointer;padding:9px 0;display:flex;gap:10px;align-items:center;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
.chapter{margin:0 0 10px 6px;padding-left:10px;border-left:2px solid var(--line)}
.lec{display:flex;gap:6px;align-items:center;padding:3px 10px 3px 0;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.lec.done{color:var(--ink)}.lecs{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:4px}
.tag{font:600 10px var(--display);padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--mute)}
.tag.live{color:var(--amber)}.tag.tba{color:var(--blue)}.tag.dpp{color:var(--blue)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--mute);font-weight:500;border-top:0}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--panel2)}
[data-theme=light]{--bg:#F4F1EA;--panel:#FFFFFF;--panel2:#ECE8DE;--line:#D6D0C2;--ink:#1C1D1B;--mute:#6B685F;--dim:#9A968A;--amber:#B86F14;--green:#3F7A66;--red:#B03A25;--blue:#5468C8}
[data-theme=light] select,[data-theme=light] input{color-scheme:light}
.track{position:relative;height:14px;background:var(--panel2);border-radius:7px;flex:1;min-width:60px}
.seg,.fill{position:absolute;top:0;bottom:0;border-radius:7px}.seg{opacity:.3}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.phases{display:flex;height:22px;border-radius:4px;overflow:hidden;font:600 9px var(--display);letter-spacing:.03em}
.phases>div{padding:5px 6px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.web .drag{height:calc(36px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}.web .shell{height:calc(100% - 36px - env(safe-area-inset-top))}
.native .drag{display:none}.native .shell{height:100%;padding-top:env(safe-area-inset-top)}
nav{padding-bottom:env(safe-area-inset-bottom)}
/* Plan tab (compact grouped cards) */
.pl-pw{position:relative;margin:10px 0 4px}
.pl-phases{display:flex;height:20px;border-radius:4px;overflow:hidden;font:600 10px var(--display);letter-spacing:.06em}
.pl-phases>div{display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden}
.pl-ptick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pl-gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);padding:10px 0 8px;cursor:pointer;font:600 13px var(--display);letter-spacing:.04em;text-align:left}
.pl-gh .chev{display:inline-block;width:12px;color:var(--mute);transition:transform .15s}
.pl-gh[aria-expanded=true] .chev{transform:rotate(90deg)}
.pl-gh .cnt{background:var(--panel2);border-radius:10px;padding:0 8px;font-size:11px;color:var(--mute)}
.pl-gh .gm{margin-left:auto;font:400 12px "Segoe UI",sans-serif;color:var(--mute);letter-spacing:0}
.pl-card{border-left:3px solid var(--c);background:var(--panel2);border-radius:0 6px 6px 0;margin:0 0 8px;padding:9px 12px}
.pl-head{cursor:pointer;outline:none}
.pl-head:focus-visible{box-shadow:0 0 0 2px var(--amber);border-radius:4px}
.pl-l1{display:flex;align-items:center;gap:8px;min-width:0}
.pl-nm{font:600 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl-sp{flex:1}.pl-nw{white-space:nowrap}
.pl-st{color:var(--c);font:600 11px var(--display);letter-spacing:.03em;white-space:nowrap}
.pl-l3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pl-track{position:relative;height:10px;background:var(--panel);border-radius:5px;margin:9px 0 6px}
.pl-seg,.pl-fill{position:absolute;top:0;bottom:0;border-radius:5px}.pl-seg{opacity:.3}
.pl-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pl-edit{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.pl-date{flex:1;font-size:11px;color:var(--mute)}
.dbtn{position:relative;display:block;width:100%;margin-top:3px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:600 13px "Segoe UI",sans-serif;text-align:left;cursor:pointer}
.dbtn input[type=date]{position:absolute;left:0;bottom:0;width:100%;height:1px;padding:0;border:0;opacity:0;pointer-events:none}
.ringw{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:4px auto 14px}.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.timer.big{font-size:clamp(34px,11vw,46px)}
.chip{background:none;border:1px solid var(--line);color:var(--mute);border-radius:16px;padding:5px 12px;font:600 12px var(--display);cursor:pointer}.chip.on{background:var(--amber);border-color:var(--amber);color:#1C1D1B}.chip:disabled{opacity:.45;cursor:default}
.mini{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--panel2);border-top:1px solid var(--line);cursor:pointer}.mini b{font:700 18px var(--display);font-variant-numeric:tabular-nums;color:var(--amber)}
.toast{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--panel2);border-radius:6px;padding:8px 10px;margin-top:10px;font-size:13px}
.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:default}
.ink{position:relative;background:none;border:0;border-bottom:1px dashed var(--mute);color:inherit;font:inherit;padding:0 2px;cursor:pointer}.ink:hover{color:var(--amber);border-color:var(--amber)}
.gearbtn{flex:0 0 46px;background:none;border:0;border-top:2px solid transparent;color:var(--mute);font-size:17px;cursor:pointer}.gearbtn:hover{color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-end}
.sheetin{width:min(820px,100%);max-height:92%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:14px calc(14px) calc(14px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="drag">GATE CSE 2027 COMMAND CENTER</div>
<div id="root"></div>
<script src="bundle.js"></script>
</body>
</html>
