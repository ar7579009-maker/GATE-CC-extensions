<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co" />
<meta name="theme-color" content="#0F0F0E" />
<link rel="manifest" href="web/manifest.webmanifest" />
<title>GATE CSE 2027 — Windows</title>
<style>
/* ── tokens ── */
:root{
  --bg:#0F0F0E;--panel:#1C1D1B;--panel2:#242522;--line:#3A3936;
  --ink:#EDEAE2;--mute:#8A8880;--dim:#5A5850;
  --amber:#D68A2B;--green:#4A7C6C;--red:#A8452F;--blue:#7B8CDE;
  --display:Bahnschrift,"DIN Alternate","Arial Narrow",sans-serif;
  --nav-w:200px;
}
[data-theme=light]{
  --bg:#F4F1EA;--panel:#FFF;--panel2:#ECE8DE;--line:#D6D0C2;
  --ink:#1C1D1B;--mute:#6B685F;--dim:#9A968A;
  --amber:#B86F14;--green:#3F7A66;--red:#B03A25;--blue:#5468C8;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",-apple-system,system-ui,sans-serif;overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ── shell: titlebar + sidebar + content ── */
.titlebar{height:32px;-webkit-app-region:drag;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}
.titlebar-title{font:600 12px var(--display);letter-spacing:.06em;color:var(--mute);flex:1}
.titlebar-chips{display:flex;gap:6px;-webkit-app-region:no-drag}

.layout{display:flex;height:calc(100vh - 32px)}

/* sidebar nav */
.sidenav{width:var(--nav-w);flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidenav-logo{padding:18px 16px 10px;font:700 13px var(--display);letter-spacing:.08em;color:var(--amber)}
.sidenav-sub{padding:0 16px 6px;font:600 10px var(--display);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.sidenav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--mute);padding:9px 16px;font:600 13px var(--display);cursor:pointer;text-align:left;border-radius:0;transition:background .1s}
.sidenav button:hover{background:var(--panel2);color:var(--ink)}
.sidenav button.on{background:color-mix(in srgb,var(--amber) 12%,transparent);color:var(--amber);border-left:3px solid var(--amber)}
.sidenav button .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidenav-spacer{flex:1}
.sidenav-bottom{padding:10px 16px 14px;border-top:1px solid var(--line)}

/* main content area */
.content{flex:1;overflow:auto;padding:20px 28px 32px;max-width:100%}
.content-inner{max-width:860px}

/* ── cards ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card-row{display:flex;gap:16px;margin-bottom:14px}
.card-row .card{flex:1;margin-bottom:0}

/* ── two-col layout for wide screens ── */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.twin .card{margin-bottom:0}
@media(max-width:900px){.twin{grid-template-columns:1fr}}

/* ── typography ── */
h2{margin:0 0 16px;font:700 18px var(--display);letter-spacing:.04em}
h3{margin:0 0 8px;font:600 14px var(--display)}
.mute{color:var(--mute)}.dim{color:var(--dim)}.small{font-size:12px}
.num{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.timer{font:700 60px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ── utils ── */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.btn{background:var(--amber);color:#1C1D1B;border:0;border-radius:6px;padding:8px 18px;font:700 13px var(--display);cursor:pointer}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.btn.stop{background:var(--red);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber)}
.bar.g>i{background:var(--green)}.bar.r>i{background:var(--red)}
.tag{font:600 10px var(--display);padding:1px 6px;border-radius:3px;background:var(--panel2);color:var(--mute)}
.tag.live{color:var(--amber)}.tag.ok{color:var(--green)}.tag.bad{color:var(--red)}
.chip{background:none;border:1px solid var(--line);color:var(--mute);border-radius:16px;padding:4px 12px;font:600 12px var(--display);cursor:pointer}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1C1D1B}
select,input[type=text],input[type=number],input[type=date],input[type=time]{
  color-scheme:dark;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;font:inherit;max-width:100%}
[data-theme=light] select,[data-theme=light] input{color-scheme:light}
input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px;cursor:pointer}
input[type=range]{accent-color:var(--amber);width:100%}

/* subject accordion */
details.sub{border-top:1px solid var(--line)}
details.sub>summary{cursor:pointer;padding:9px 0;display:flex;gap:10px;align-items:center;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
.chapter{margin:0 0 10px 6px;padding-left:10px;border-left:2px solid var(--line)}
.lec{display:flex;gap:6px;align-items:center;padding:3px 10px 3px 0;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.lec.done{color:var(--ink)}

/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-top:1px solid var(--line);text-align:left;font-size:13px}
th{color:var(--mute);font-weight:500;border-top:0}

/* timer ring */
.ringw{position:relative;width:200px;aspect-ratio:1;margin:0 auto 16px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* mini timer bar (when timer running, pinned to sidebar bottom) */
.timer-pin{background:color-mix(in srgb,var(--amber) 10%,transparent);border-top:1px solid var(--line);padding:10px 16px;cursor:pointer}
.timer-pin b{font:700 20px var(--display);font-variant-numeric:tabular-nums;color:var(--amber)}

/* status bar */
.statusbar{display:flex;gap:14px;align-items:center;padding:0 0 16px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);margin-bottom:18px}
.statusbar b{color:var(--ink)}

/* sheet (settings overlay) */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center}
.sheetin{width:min(640px,92vw);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px}

/* plan gantt */
.pl-card{border-left:3px solid var(--c);background:var(--panel2);border-radius:0 6px 6px 0;margin:0 0 8px;padding:9px 12px}
.pl-track{position:relative;height:10px;background:var(--panel);border-radius:5px;margin:8px 0 4px}
.pl-fill,.pl-seg{position:absolute;top:0;bottom:0;border-radius:5px}.pl-seg{opacity:.3}
.pl-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pl-phases{display:flex;height:18px;border-radius:4px;overflow:hidden;font:600 9px var(--display);letter-spacing:.06em}
.pl-phases>div{display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;padding:0 4px}
</style>
</head>
<body>
<!-- Windows layout shell: titlebar + sidebar + content area -->
<!-- bundle.js selects this layout via data-platform="win" on body -->
<div class="titlebar">
  <span class="titlebar-title">GATE CSE 2027 COMMAND CENTER</span>
  <div class="titlebar-chips" id="hd-chips"></div>
</div>
<div class="layout">
  <nav class="sidenav" id="sidenav">
    <div class="sidenav-logo">GCC</div>
    <div class="sidenav-sub">Study</div>
    <button class="on" data-tab="today"><span class="ico">⚡</span>Today</button>
    <button data-tab="plan"><span class="ico">📅</span>Plan</button>
    <button data-tab="syllabus"><span class="ico">📚</span>Syllabus</button>
    <div class="sidenav-sub" style="margin-top:8px">Progress</div>
    <button data-tab="ready"><span class="ico">📊</span>Readiness</button>
    <button data-tab="tests"><span class="ico">📝</span>Tests</button>
    <div class="sidenav-spacer"></div>
    <div class="sidenav-bottom">
      <button data-tab="settings"><span class="ico">⚙</span>Settings</button>
    </div>
    <div id="timer-pin" class="timer-pin" style="display:none"></div>
  </nav>
  <main class="content" id="content">
    <div class="content-inner" id="root"></div>
  </main>
</div>
<script>
  // Mark platform so App.jsx can detect it
  document.body.dataset.platform = 'win';
  // Wire sidebar tab clicks → send to React
  document.getElementById('sidenav').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    document.querySelectorAll('.sidenav [data-tab]').forEach(b => b.classList.toggle('on', b === btn));
    window.__gccSetTab?.(btn.dataset.tab);
  });
</script>
<script src="bundle.js"></script>
</body>
</html>
