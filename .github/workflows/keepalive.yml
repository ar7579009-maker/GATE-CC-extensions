name: Keep Supabase awake

# A free Supabase project pauses after 7 days without activity. This calls public.ping() every 3 days.
# Needs the ping() function from supabase-hardening.sql (or supabase-v10-cleanup.sql on an existing project).
# If the project is paused or unreachable the run fails and GitHub emails you.
on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://haeyoyzkdbzyqdbtxunj.supabase.co
      SB_KEY: sb_publishable_zKGtqCEbHwRuCHtbNWDAwg_I8VI65sH   # same public key the app ships with
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SB_URL/rest/v1/rpc/ping" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded HTTP $code"
          [ "$code" = "200" ]
