name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - run: npx cap add android
      - run: npx capacitor-assets generate --android   # builds launcher icons from assets/*.png
      - run: npm run android
      - name: Android permissions (exact alarms for the focus timer, notifications)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in SCHEDULE_EXACT_ALARM POST_NOTIFICATIONS; do grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M; done
          grep -c "uses-permission" $M
      # Optional: keep one signing key so new APKs install over the old app (no uninstall needed).
      # Create the secret once; see SETUP.md. Without it, every build is signed with a fresh key.
      - name: Restore signing key
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "using fixed key"; else echo "WARNING: no fixed key set; this APK will not install over the previous one"; fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GATE-Command-Center-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: GATE-Command-Center-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build:html
      - uses: actions/upload-artifact@v4
        with:
          name: GATE-Command-Center-html
          path: dist-html/GATE-Command-Center.html
